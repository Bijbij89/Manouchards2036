<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.25, maximum-scale=3">
<title>Grilles Jazz</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title-block">
      <h1 id="song-title"></h1>
      <span id="song-form" class="muted"></span>
    </div>
    <div class="header-actions">
      <input type="file" id="photo-input" accept="image/*" hidden>
      <button id="photo-btn" class="icon-btn-lg" title="Ajouter une grille (photo)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
      <div class="menu-wrap">
        <button id="menu-btn" class="icon-btn-lg" title="Plus d'options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </button>
        <div id="menu-panel" class="menu-panel" hidden>
          <button id="new-song-menu-item">Créer une nouvelle grille</button>
          <button id="import-menu-item">Importer des grilles (JSON)</button>
          <button id="export-menu-item">Exporter mes grilles (JSON)</button>
          <button id="sync-menu-item">Synchroniser les grilles</button>
        </div>
      </div>
    </div>
    <input type="file" id="import-input" accept=".json" multiple hidden>
  </header>

  <div id="new-song-panel" class="new-song-panel" hidden>
    <input type="text" id="new-song-title" placeholder="Nom du morceau...">
    <select id="new-song-bars">
      <option value="16">16 mesures</option>
      <option value="32" selected>32 mesures</option>
      <option value="64">64 mesures</option>
    </select>
    <button id="confirm-new-song">Créer</button>
    <button id="cancel-new-song" class="ghost">Annuler</button>
  </div>

  <div id="sync-panel" class="new-song-panel" hidden>
    <span id="sync-summary"></span>
    <button id="sync-new-only">Ajouter les nouvelles seulement</button>
    <button id="sync-overwrite" class="ghost">Tout remplacer</button>
    <button id="sync-cancel" class="ghost">Annuler</button>
  </div>

  <div class="controls">
    <div class="combobox" id="song-combobox">
      <button id="combobox-trigger" class="combobox-trigger" type="button">
        <span id="combobox-label">Choisir un morceau</span>
        <span class="chevron">&#9662;</span>
      </button>
      <div id="combobox-panel" class="combobox-panel" hidden>
        <input type="text" id="song-search" placeholder="Rechercher...">
        <div id="song-list" class="song-list"></div>
      </div>
    </div>
    <div class="controls-secondary">
      <div class="field">
        <label>Tonalité</label>
        <select id="key-select"></select>
      </div>
      <label class="validated-label">
        <input type="checkbox" id="validated-checkbox"> Vérifiée
      </label>
      <button id="edit-mode-btn" class="pill-btn">Édition</button>
    </div>
  </div>

  <label class="analyze-label">
    <input type="checkbox" id="analyze-checkbox"> Analyser la grille (II-V-I, anatoles)
  </label>

  <div id="edit-error" class="error" hidden></div>

  <div id="grid" class="grid"></div>

  <div id="add-remove-row" class="add-remove-row" hidden>
    <button id="add-row-btn" class="ghost">+ Ajouter une ligne</button>
    <button id="remove-row-btn" class="ghost">- Retirer une ligne</button>
  </div>

  <div id="upload-status" class="muted upload-status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
